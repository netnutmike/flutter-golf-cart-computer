name: golf_cart_computer
description: "Flutter Golf Cart Computer - Cross-platform display computer for golf cart telemetry, mesh messaging, and navigation."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management and dependency injection
  flutter_riverpod: ^2.6.1

  # Bluetooth Low Energy
  flutter_blue_plus: ^1.35.2

  # GPS and location
  geolocator: ^13.0.2

  # Protocol Buffers
  protobuf: ^4.1.0

  # Persistence
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  path_provider: ^2.1.5

  # Permissions
  permission_handler: ^12.0.3

  # Audio
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Property-based testing
  glados: ^1.1.7

  # Mocking
  mocktail: ^1.0.4

  # Code generation
  build_runner: ^2.4.13
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
