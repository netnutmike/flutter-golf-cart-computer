syntax = "proto3";

package meshtastic;

option java_package = "com.geeksville.mesh";
option java_outer_classname = "ChannelProtos";

/**
 * Channel settings for a Meshtastic channel.
 */
message ChannelSettings {
  // Channel number (0-7)
  uint32 channel_num = 1;
  // Pre-shared key for encryption (empty = default key)
  bytes psk = 2;
  // Channel name (short, for display)
  string name = 3;
  // Fixed ID for the channel
  fixed32 id = 4;
  // Uplink enabled
  bool uplink_enabled = 5;
  // Downlink enabled
  bool downlink_enabled = 6;
}

/**
 * A channel definition including settings and role.
 */
message Channel {
  // Channel index (0-7)
  int32 index = 1;
  // Channel settings
  ChannelSettings settings = 2;
  // Role of this channel
  Channel.Role role = 3;

  enum Role {
    // Channel is disabled
    DISABLED = 0;
    // Primary channel
    PRIMARY = 1;
    // Secondary channel
    SECONDARY = 2;
  }
}
